<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TrackRecord</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1><a href="index.html">TrackRecord</a></h1>
        <nav id="headernav">
            <ul>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Create Account</a></li>
                <li><a href="songs.html">Discover Songs</a></li>
                <li><a href="users.html">Discover Users</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="register">
            <h2>Create Your Account</h2>
            <p>Start your musical journey with TrackRecord!</p>
            <form id="register-form">
            <label for="register-email">Email Address</label>
            <input type="email" id="register-email"
               name="email"
               placeholder="Enter your email" required>
            <label for="register-username">Username</label>
            <input type="text" id="register-username"
               name="username"
               placeholder="Choose a username" required>
            <label for="register-password">Password</label>
            <input type="password" id="register-password"
               name="password"
               placeholder="Create a password" required>
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password"
               name="confirm-password"
               placeholder="Confirm your password" required>
            <button type="submit">Create Account</button>
            </form>
            <p class="account-link">
                Already have an account?
                <a href="login.html">Log in here</a>
            </p>
        </section>
    </main>
    </main>
    <footer>
        <nav id="footernav">
            <ul>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Create Account</a></li>

            </ul>
        </nav>

</body>
</html>
